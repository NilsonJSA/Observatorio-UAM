{% extends 'core/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card space-card p-4 mt-5">
            <h3 class="text-center mb-4">Iniciar Sesión</h3>
            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" name="email" class="form-control" placeholder="astronomo@uam.edu.ni" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-neon w-100">Acceder al Sistema</button>
            </form>
            <div class="text-center mt-3">
                <small>¿No tienes acceso? <a href="{% url 'register' %}" class="text-info">Regístrate aquí</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
